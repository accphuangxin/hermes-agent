name: Build Windows installer

on:
  push:
    branches: [main]
  workflow_dispatch:
  release:
    types: [published]

permissions:
  contents: write  # needed to upload release assets

concurrency:
  group: build-windows-installer-${{ github.ref }}
  cancel-in-progress: true

jobs:
  build:
    name: Build Windows installer (x86_64)
    runs-on: windows-latest
    timeout-minutes: 45

    env:
      PBS_VERSION: "20260510"
      PBS_PYTHON_VERSION: "3.11.15"
      PBS_TARBALL: "cpython-3.11.15+20260510-x86_64-pc-windows-msvc-install_only.tar.gz"
      PBS_URL: "https://github.com/astral-sh/python-build-standalone/releases/download/20260510/cpython-3.11.15+20260510-x86_64-pc-windows-msvc-install_only.tar.gz"
      STAGING_ROOT: "C:\\hermes-build"
      INSTALL_DIR: "C:\\hermes-build\\hermes"

    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Install uv
        uses: astral-sh/setup-uv@v4

      - name: Read version from pyproject.toml
        id: version
        shell: pwsh
        run: |
          $ver = (Select-String -Path pyproject.toml -Pattern '^version = "(.+)"').Matches[0].Groups[1].Value
          echo "VERSION=$ver" >> $env:GITHUB_ENV
          echo "version=$ver" >> $env:GITHUB_OUTPUT

      - name: Cache python-build-standalone tarball
        uses: actions/cache@v4
        with:
          path: build\windows\${{ env.PBS_TARBALL }}
          key: pbs-windows-${{ env.PBS_VERSION }}-${{ env.PBS_TARBALL }}

      - name: Download and verify python-build-standalone
        shell: pwsh
        run: |
          $buildDir = "build\windows"
          New-Item -ItemType Directory -Force -Path $buildDir | Out-Null

          $tarball = "$buildDir\$env:PBS_TARBALL"
          if (-not (Test-Path $tarball)) {
            Write-Host "==> Downloading Python $env:PBS_PYTHON_VERSION (x86_64 Windows)"
            curl.exe -fL --progress-bar -o $tarball $env:PBS_URL
          } else {
            Write-Host "==> Using cached tarball: $tarball"
          }

          Write-Host "==> Fetching SHA256SUMS for verification"
          $sha256sumsUrl = "https://github.com/astral-sh/python-build-standalone/releases/download/$env:PBS_VERSION/SHA256SUMS"
          $sha256sums = curl.exe -fsSL $sha256sumsUrl
          $expectedLine = $sha256sums -split "`n" | Where-Object { $_ -match [regex]::Escape($env:PBS_TARBALL) } | Select-Object -First 1
          if (-not $expectedLine) {
            Write-Error "Could not find $env:PBS_TARBALL in SHA256SUMS"
            exit 1
          }
          $expectedHash = ($expectedLine -split '\s+')[0].Trim()
          Write-Host "Expected SHA256: $expectedHash"

          $actualHash = (Get-FileHash -Algorithm SHA256 $tarball).Hash.ToLower()
          Write-Host "Actual SHA256:   $actualHash"
          if ($actualHash -ne $expectedHash.ToLower()) {
            Write-Error "SHA-256 mismatch for $env:PBS_TARBALL"
            exit 1
          }
          Write-Host "==> Checksum verified OK"

      - name: Extract Python to staging directory
        shell: pwsh
        run: |
          $buildDir = "build\windows"
          $tarball  = "$buildDir\$env:PBS_TARBALL"

          Write-Host "==> Extracting Python to $env:INSTALL_DIR"
          New-Item -ItemType Directory -Force -Path $env:STAGING_ROOT | Out-Null
          tar -xzf $tarball -C $env:STAGING_ROOT --strip-components=1

          $pythonExe = "$env:INSTALL_DIR\python.exe"
          if (-not (Test-Path $pythonExe)) {
            Write-Error "python.exe not found at $pythonExe after extraction"
            Get-ChildItem $env:STAGING_ROOT -Recurse -Filter "python.exe" | Select-Object FullName
            exit 1
          }
          & $pythonExe --version

      - name: Build sdist with uv
        shell: pwsh
        run: |
          New-Item -ItemType Directory -Force -Path "build\windows\sdist" | Out-Null
          uv build --sdist --out-dir "build\windows\sdist" .

          $sdist = Get-ChildItem "build\windows\sdist\hermes*agent*.tar.gz" | Select-Object -First 1
          if (-not $sdist) {
            Write-Error "sdist not found in build\windows\sdist"
            Get-ChildItem "build\windows\sdist"
            exit 1
          }
          echo "SDIST_PATH=$($sdist.FullName)" >> $env:GITHUB_ENV
          Write-Host "==> Built sdist: $($sdist.FullName)"

      - name: Create venv and install hermes-agent
        shell: pwsh
        run: |
          $pythonExe = "$env:INSTALL_DIR\python.exe"
          $venvDir   = "$env:INSTALL_DIR\venv"

          Write-Host "==> Creating venv at $venvDir"
          & $pythonExe -m venv $venvDir

          $pip = "$venvDir\Scripts\pip.exe"
          Write-Host "==> Upgrading pip and wheel"
          & $pip install --quiet --upgrade pip wheel

          Write-Host "==> Installing hermes-agent sdist with extras"
          & $pip install --quiet "${{ env.SDIST_PATH }}[cli,pty,mcp,acp,google,youtube,web,homeassistant,sms]"

          Write-Host "==> Verifying installation"
          & "$venvDir\Scripts\hermes.exe" --version 2>&1 | Write-Host

      - name: Write launcher .cmd files
        shell: pwsh
        run: |
          $binDir = "$env:INSTALL_DIR\bin"
          New-Item -ItemType Directory -Force -Path $binDir | Out-Null

          # Launchers reference C:\hermes (default INSTDIR).
          # The NSIS installer rewrites them with the actual $INSTDIR at install time.
          Set-Content -Path "$binDir\hermes.cmd"       -Value "@echo off`r`n`"C:\hermes\venv\Scripts\hermes.exe`" %*`r`n"       -NoNewline
          Set-Content -Path "$binDir\hermes-agent.cmd" -Value "@echo off`r`n`"C:\hermes\venv\Scripts\hermes-agent.exe`" %*`r`n" -NoNewline
          Set-Content -Path "$binDir\hermes-acp.cmd"   -Value "@echo off`r`n`"C:\hermes\venv\Scripts\hermes-acp.exe`" %*`r`n"   -NoNewline

          Write-Host "==> Launcher scripts written to $binDir"
          Get-ChildItem $binDir

      - name: Install NSIS
        shell: pwsh
        run: |
          Write-Host "==> Installing NSIS via Chocolatey"
          choco install nsis --yes --no-progress
          $nsisPath = "C:\Program Files (x86)\NSIS"
          if (Test-Path "$nsisPath\makensis.exe") {
            echo "$nsisPath" >> $env:GITHUB_PATH
            Write-Host "==> NSIS installed at $nsisPath"
          } else {
            Write-Error "makensis.exe not found after install"
            exit 1
          }

      - name: Generate NSIS script
        shell: pwsh
        run: |
          $ver = $env:VERSION
          $nsisScript = @"
; hermes-agent Windows installer — generated by CI
Unicode True

!include "WordFunc.nsh"
!include "StrFunc.nsh"
`${StrStr}
`${StrRep}

!define PRODUCT_NAME    "Hermes Agent"
!define PRODUCT_VERSION "$ver"
!define PRODUCT_PUBLISHER "Nous Research"
!define UNINSTALL_KEY   "Software\Microsoft\Windows\CurrentVersion\Uninstall\HermesAgent"
!define REG_PATH_KEY    "SYSTEM\CurrentControlSet\Control\Session Manager\Environment"

Name "`${PRODUCT_NAME} `${PRODUCT_VERSION}"
OutFile "dist\hermes-agent-$ver-windows-x86_64.exe"
InstallDir "C:\hermes"
InstallDirRegKey HKLM "`${UNINSTALL_KEY}" "InstallLocation"
RequestExecutionLevel admin
ShowInstDetails show
ShowUnInstDetails show

Page directory
Page instfiles
UninstPage uninstConfirm
UninstPage instfiles

; Append dir to system PATH if not already present
!macro AddToPath dir
  ReadRegStr `$R0 HKLM "`${REG_PATH_KEY}" "Path"
  `${StrStr} `$R1 "`$R0" "${dir}"
  StrCmp `$R1 "" 0 already_in_path
    WriteRegExpandStr HKLM "`${REG_PATH_KEY}" "Path" "`$R0;${dir}"
    SendMessage `${HWND_BROADCAST} `${WM_WININICHANGE} 0 "STR:Environment" /TIMEOUT=5000
  already_in_path:
!macroend

; Remove dir from system PATH
!macro RemoveFromPath dir
  ReadRegStr `$R0 HKLM "`${REG_PATH_KEY}" "Path"
  Push "`$R0"
  Push "${dir}"
  Call un.StrRemovePath
  Pop `$R0
  WriteRegExpandStr HKLM "`${REG_PATH_KEY}" "Path" "`$R0"
  SendMessage `${HWND_BROADCAST} `${WM_WININICHANGE} 0 "STR:Environment" /TIMEOUT=5000
!macroend

Section "Hermes Agent" SecMain
  SectionIn RO

  SetOutPath "`$INSTDIR"
  File /r "C:\hermes-build\hermes\*"

  WriteUninstaller "`$INSTDIR\uninstall.exe"

  WriteRegStr   HKLM "`${UNINSTALL_KEY}" "DisplayName"     "`${PRODUCT_NAME}"
  WriteRegStr   HKLM "`${UNINSTALL_KEY}" "DisplayVersion"  "`${PRODUCT_VERSION}"
  WriteRegStr   HKLM "`${UNINSTALL_KEY}" "Publisher"       "`${PRODUCT_PUBLISHER}"
  WriteRegStr   HKLM "`${UNINSTALL_KEY}" "InstallLocation" "`$INSTDIR"
  WriteRegStr   HKLM "`${UNINSTALL_KEY}" "UninstallString" "`$INSTDIR\uninstall.exe"
  WriteRegDWORD HKLM "`${UNINSTALL_KEY}" "NoModify"        1
  WriteRegDWORD HKLM "`${UNINSTALL_KEY}" "NoRepair"        1

  !insertmacro AddToPath "`$INSTDIR\bin"

  ; Rewrite launchers with actual install path (handles non-default install dir)
  FileOpen `$0 "`$INSTDIR\bin\hermes.cmd" w
  FileWrite `$0 "@echo off`$\r`$\n"
  FileWrite `$0 "`"`$INSTDIR\venv\Scripts\hermes.exe`" %*`$\r`$\n"
  FileClose `$0

  FileOpen `$0 "`$INSTDIR\bin\hermes-agent.cmd" w
  FileWrite `$0 "@echo off`$\r`$\n"
  FileWrite `$0 "`"`$INSTDIR\venv\Scripts\hermes-agent.exe`" %*`$\r`$\n"
  FileClose `$0

  FileOpen `$0 "`$INSTDIR\bin\hermes-acp.cmd" w
  FileWrite `$0 "@echo off`$\r`$\n"
  FileWrite `$0 "`"`$INSTDIR\venv\Scripts\hermes-acp.exe`" %*`$\r`$\n"
  FileClose `$0
SectionEnd

Section "Uninstall"
  !insertmacro RemoveFromPath "`$INSTDIR\bin"
  DeleteRegKey HKLM "`${UNINSTALL_KEY}"
  RMDir /r "`$INSTDIR"
SectionEnd

Function un.StrRemovePath
  Exch `$R0
  Exch
  Exch `$R1
  Push `$R2
  Push `$R3
  StrCpy `$R2 ""
  loop:
    `${WordFind} "`$R1" ";" "+1" `$R3
    StrCmp `$R3 "" done
    StrCmp `$R3 "`$R0" skip
      StrCmp `$R2 "" 0 +2
        StrCpy `$R2 "`$R3"
        Goto next
      StrCpy `$R2 "`$R2;`$R3"
    next:
      `${WordFind} "`$R1" ";" "-1{" `$R1
      StrCmp `$R1 `$R3 done loop
    skip:
      `${WordFind} "`$R1" ";" "-1{" `$R1
      StrCmp `$R1 `$R3 done loop
  done:
  Pop `$R3
  Pop `$R2
  Pop `$R1
  Exch `$R2
FunctionEnd
"@

          New-Item -ItemType Directory -Force -Path dist | Out-Null
          Set-Content -Path "hermes-agent.nsi" -Value $nsisScript -Encoding UTF8
          Write-Host "==> NSIS script written"

      - name: Build NSIS installer
        shell: pwsh
        run: |
          makensis /V3 hermes-agent.nsi
          $exe = "dist\hermes-agent-${{ env.VERSION }}-windows-x86_64.exe"
          if (-not (Test-Path $exe)) {
            Write-Error "Expected installer not found: $exe"
            Get-ChildItem dist
            exit 1
          }
          Write-Host "==> Built: $exe"
          $size = [math]::Round((Get-Item $exe).Length / 1MB, 1)
          Write-Host "    Size: ${size} MB"

      - name: Upload artifact
        uses: actions/upload-artifact@v4
        with:
          name: hermes-agent-windows-x86_64-installer
          path: dist\hermes-agent-*-windows-x86_64.exe
          retention-days: 7

      - name: Upload to GitHub Release
        if: github.event_name == 'release'
        shell: pwsh
        env:
          GITHUB_TOKEN: ${{ github.token }}
        run: |
          $exe = (Get-ChildItem "dist\hermes-agent-*-windows-x86_64.exe" | Select-Object -First 1).FullName
          gh release upload "${{ github.event.release.tag_name }}" `
            "$exe" `
            --repo "${{ github.repository }}" `
            --clobber
