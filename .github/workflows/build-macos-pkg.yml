name: Build macOS pkg

on:
  push:
    branches: [main]
  workflow_dispatch:
  release:
    types: [published]

permissions:
  contents: write  # needed to upload release assets

concurrency:
  group: build-macos-pkg-${{ github.ref }}
  cancel-in-progress: true

jobs:
  build:
    name: Build macOS .pkg (arm64)
    runs-on: macos-15
    timeout-minutes: 30

    env:
      PBS_VERSION: "20260510"
      PBS_TARBALL: "cpython-3.11.15+20260510-aarch64-apple-darwin-install_only.tar.gz"

    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Install uv
        uses: astral-sh/setup-uv@v4

      - name: Verify pkgbuild is available
        run: |
          if ! command -v pkgbuild &>/dev/null; then
            echo "::error::pkgbuild not found — Xcode Command Line Tools are missing"
            exit 1
          fi
          pkgbuild --version 2>&1 || true

      - name: Cache python-build-standalone tarball
        uses: actions/cache@v4
        with:
          path: build/macos-pkg/${{ env.PBS_TARBALL }}
          key: pbs-${{ env.PBS_VERSION }}-${{ env.PBS_TARBALL }}

      - name: Build macOS pkg
        run: ./packaging/macos/build-pkg.sh

      - name: Verify output exists
        run: |
          PKG=$(ls dist/hermes-agent-*-arm64.pkg 2>/dev/null | head -1)
          if [[ -z "${PKG}" ]]; then
            echo "::error::Expected dist/hermes-agent-*-arm64.pkg not found"
            ls dist/ || true
            exit 1
          fi
          echo "Built: ${PKG}"
          du -sh "${PKG}"

      - name: Upload artifact
        uses: actions/upload-artifact@v4
        with:
          name: hermes-agent-macos-arm64-pkg
          path: dist/hermes-agent-*-arm64.pkg
          retention-days: 7

      - name: Upload to GitHub Release
        if: github.event_name == 'release'
        env:
          GITHUB_TOKEN: ${{ github.token }}
        run: |
          PKG=$(ls dist/hermes-agent-*-arm64.pkg | head -1)
          gh release upload "${{ github.event.release.tag_name }}" \
            "${PKG}" \
            --repo "${{ github.repository }}" \
            --clobber
