name: macOS Package (x86_64 / Intel)

on:
  push:
    tags:
      - 'v20*'
  workflow_dispatch:
    inputs:
      confirm_tag:
        description: 'Tag / ref to build from (e.g. v2026.5.15). Defaults to HEAD.'
        required: false
        type: string

permissions:
  contents: read

concurrency:
  group: macos-package-x86_64-${{ github.ref }}
  cancel-in-progress: false

jobs:
  build:
    name: Build macOS .pkg (x86_64)
    runs-on: macos-12
    timeout-minutes: 60

    steps:
      - name: Checkout code
        uses: actions/checkout@34e114876b0b11c390a56381ad16ebd13914f8d5  # v4
        with:
          persist-credentials: false
          ref: ${{ inputs.confirm_tag || github.ref }}
          fetch-tags: true
          submodules: recursive

      - name: Validate tag exists (workflow_dispatch only)
        if: github.event_name == 'workflow_dispatch' && inputs.confirm_tag != ''
        run: |
          if ! git tag -l "${{ inputs.confirm_tag }}" | grep -q .; then
            echo "::error::Tag '${{ inputs.confirm_tag }}' does not exist in the repo"
            exit 1
          fi

      - name: Install uv
        uses: astral-sh/setup-uv@d4b2f3b6ecc6e67c4457f6d3e41ec42d3d0fcb86  # v5

      - name: Set up Node.js
        uses: actions/setup-node@49933ea5288caeca8642d1e84afbd3f7d6820020  # v4
        with:
          node-version: '22'

      - name: Build web dashboard
        run: cd web && npm ci && npm run build

      - name: Build TUI bundle
        run: cd ui-tui && npm ci && npm run build

      - name: Bundle TUI into hermes_cli
        run: |
          mkdir -p hermes_cli/tui_dist
          cp ui-tui/dist/entry.js hermes_cli/tui_dist/entry.js

      - name: Verify frontend assets
        run: |
          [ -f hermes_cli/web_dist/index.html ] || { echo "ERROR: web_dist not built"; exit 1; }
          [ -f hermes_cli/tui_dist/entry.js ]   || { echo "ERROR: tui_dist not built"; exit 1; }

      - name: Build .pkg installer
        run: |
          chmod +x packaging/macos/build-pkg.sh
          packaging/macos/build-pkg.sh

      - name: List dist artifacts
        run: ls -lh dist/*.pkg

      - name: Upload artifact
        uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02  # v4
        with:
          name: macos-package-x86_64
          path: dist/*-macos-x86_64.pkg
          retention-days: 30
          if-no-files-found: error

  attach-to-release:
    name: Attach to GitHub Release
    needs: build
    if: startsWith(github.ref, 'refs/tags/')
    runs-on: ubuntu-latest
    timeout-minutes: 10
    permissions:
      contents: write

    steps:
      - name: Download artifact
        uses: actions/download-artifact@d3f86a106a0bac45b974a628896c90dbdf5c8093  # v4
        with:
          name: macos-package-x86_64
          path: dist/

      - name: Wait for GitHub Release to exist
        env:
          GITHUB_TOKEN: ${{ github.token }}
        run: |
          for i in $(seq 1 30); do
            if gh release view "$GITHUB_REF_NAME" --repo "$GITHUB_REPOSITORY" >/dev/null 2>&1; then
              echo "Release $GITHUB_REF_NAME found"
              exit 0
            fi
            echo "Waiting for release... ($i/30)"
            sleep 10
          done
          echo "::warning::Release $GITHUB_REF_NAME not found after 5 minutes — skipping asset upload"
          echo "skip_upload=true" >> "$GITHUB_ENV"

      - name: Upload to release
        if: env.skip_upload != 'true'
        env:
          GITHUB_TOKEN: ${{ github.token }}
        run: |
          gh release upload "$GITHUB_REF_NAME" \
            dist/*-macos-x86_64.pkg \
            --repo "$GITHUB_REPOSITORY" \
            --clobber
